name: Python CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'Python/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

jobs:
  # Discover every Python/<name>/ directory that has at least one
  # *.py file. Mirrors Java CI's discover job: adding/renaming/
  # removing a project needs no workflow edit.
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.set-matrix.outputs.projects }}
    steps:
      - uses: actions/checkout@v7

      - id: set-matrix
        run: |
          projects=$(find Python -mindepth 2 -maxdepth 2 -name '*.py' \
            | sed -E 's#^Python/([^/]+)/.*\.py$#\1#' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Discovered projects: $projects"
          if [ "$projects" = "[]" ]; then
            echo "::error::No Python/*/*.py found - discovery is broken or the tree is empty."
            exit 1
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

  lint-and-smoke-test:
    name: lint-and-smoke-test (${{ matrix.project }})
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install ruff
        # Pinned: an unpinned ruff changes the lint result under an unchanged tree (see Python/ruff.toml).
        run: pip install "ruff==0.16.9"

      - name: Lint
        working-directory: Python/${{ matrix.project }}
        run: ruff check .

      # Every script here is a standalone CLI with no required runtime
      # dependency for argument parsing itself (Pillow etc. are imported
      # lazily, only when an action actually runs) - so `--help` alone
      # fully exercises argparse construction (including all subparsers)
      # without needing anything from requirements.txt installed.
      - name: Smoke test (--help)
        working-directory: Python/${{ matrix.project }}
        run: |
          for f in *.py; do
            echo "=== $f --help ==="
            python3 "$f" --help
          done

      # THE SMOKE TEST IS NOT A TEST RUN, and until 2026-09-22 it was quietly
      # doing duty as one. PyMirror's test files ignore argv, so `--help`
      # happened to execute their cases - three of the five. The other two
      # have an argparse and printed their help instead, so their cases had
      # never run in CI at all. A test that an argument can switch off is a
      # test that will be off on the day it matters.
      #
      # So: run them by name, with no arguments, and let a non-zero exit fail
      # the job. A project with no test files says so and passes.
      - name: Tests
        working-directory: Python/${{ matrix.project }}
        run: |
          shopt -s nullglob
          tests=( *_test.py *-test.py )
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no test files in this project"
            exit 0
          fi
          for t in "${tests[@]}"; do
            echo "=== $t"
            python3 "$t"
          done

  # Single required status check for branch protection - green only if
  # every discovered project's lint-and-smoke-test job succeeded.
  all-green:
    name: All Python checks passed
    needs: lint-and-smoke-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.lint-and-smoke-test.result }}" != "success" ]; then
            echo "::error::At least one Python module failed lint or smoke test."
            exit 1
          fi
          echo "All Python modules passed."
