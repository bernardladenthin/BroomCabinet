name: Dependabot schedule

# Every entry of .github/dependabot.yml runs weekly on Saturday and has a group. The rule lives in
# bernardladenthin/actions (common/check-dependabot); this workflow runs it whenever the file changes.
on:
  push:
    branches: [main]
    paths: [".github/dependabot.yml", ".github/workflows/dependabot-check.yml"]
  pull_request:
    paths: [".github/dependabot.yml", ".github/workflows/dependabot-check.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Dependabot weekly on Saturday, grouped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: bernardladenthin/actions/common/check-dependabot@379fb9448915b8ce7153f6ec5fa65544205196db # v1.2.2
