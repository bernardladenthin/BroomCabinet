# General German income tax parameters per assessment year (employees). No personal data; share it.
#
# EVERY YEAR IS A COMPLETE, SELF-CONTAINED BLOCK, with no inheritance: what rarely changes is still
# repeated in every year, because "rarely" is not "never" (VAT changed in 2020). A test checks that
# all years carry the same keys and that the tariff is continuous at every zone border.
# Amounts in euros, rates as decimals (0.20 = 20 %). No warranty; the legal sources are in the comments.

