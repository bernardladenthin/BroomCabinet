# Shared by every Python/<project>/ (ruff finds it by walking up from the working directory).
#
# The rule set is named explicitly instead of left to ruff's default, because the default is not
# stable across releases: ruff 0.16 widened it (pyupgrade, refurb, flake8-executable, ...), and with
# the unpinned `pip install ruff` in python-ci.yml every module went red on main without a line of
# code changing. These are the rules the scripts were written against -- syntax errors, undefined
# names, unused imports and the like. Widening them is a separate, deliberate change.
[lint]
select = ["E4", "E7", "E9", "F"]
